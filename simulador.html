<style>
/* Acceso: tarjeta centrada; tras entrar, tarjeta de novedades por versión */
:root{--paper:#F6F7F5;--surface:#FFFFFF;--ink:#16212E;--muted:#56616E;--rule:#D8DDE2;--sun:#D9940F;--sun-soft:#F6E7C4;--sun-ink:#8A5A00;--risk:#A8432A;
--serif:"Spectral",Georgia,serif;--sans:"Public Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111A24;--surface:#18232F;--ink:#E8ECEF;--muted:#A3AEB9;--rule:#2C3A48;--sun:#F0B13A;--sun-soft:#3A2F17;--sun-ink:#F0B13A;--risk:#E58A70;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111A24;--surface:#18232F;--ink:#E8ECEF;--muted:#A3AEB9;--rule:#2C3A48;--sun:#F0B13A;--sun-soft:#3A2F17;--sun-ink:#F0B13A;--risk:#E58A70;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);display:grid;place-items:center;padding-inline:16px;padding-block:24px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:28px 24px;border-top:4px solid var(--sun)}
.card.wide{max-width:560px}
.k{font-size:13px;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
h1{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;margin:0 0 8px;text-wrap:balance}
p.s{font-size:14.5px;color:var(--muted);margin:0 0 20px;line-height:1.5}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:500 17px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:12px;font:700 15px var(--sans);color:var(--paper);background:var(--ink);border:1px solid var(--ink);border-radius:6px;padding:12px;cursor:pointer;min-height:48px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
input:focus-visible,.btn:focus-visible,.lang button:focus-visible,summary:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.err{color:var(--risk);font-size:14px;margin:10px 0 0;min-height:1.2em}
.pt{font-size:12.5px;color:var(--muted);margin:16px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.lang button{appearance:none;border:0;background:none;color:var(--muted);font:600 12.5px var(--sans);padding:6px 11px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ver{border-top:1px solid var(--rule);padding:14px 0 4px}
.ver h2{font-size:15px;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ver .d{font-weight:400;color:var(--muted);font-size:13px}
.tag{font-size:11.5px;font-weight:700;background:var(--sun-soft);color:var(--sun-ink);padding:2px 8px;border-radius:10px}
.ver ul{margin:8px 0 6px;padding-left:18px}
.ver li{font-size:14.5px;line-height:1.5;margin:5px 0}
details.ver summary{cursor:pointer;list-style:none;font-weight:700;font-size:14px;min-height:32px;display:flex;align-items:center;gap:8px}
details.ver summary::-webkit-details-marker{display:none}
details.ver summary::after{content:"+";margin-left:auto;color:var(--muted)}
details.ver[open] summary::after{content:"–"}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.acts .btn{margin-top:0}
</style>
</head>

<form class="card" id="f" autocomplete="off">
  <p class="k">Acceso restringido · Acesso restrito</p>
  <h1>Simulador de negocio solar</h1>
  <p class="s">Ingresá la contraseña que recibiste. Un solo acceso para el estudio y el simulador.</p>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <button type="submit" class="btn" id="go">Entrar</button>
  <p class="err" id="err" aria-live="polite"></p>
  <p class="pt">Estudo em espanhol e português. Digite a senha para entrar.</p>
</form>

function u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function dec(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c));
  if(P.z){var st=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));raw=await new Response(st).arrayBuffer();}
  return JSON.parse(new TextDecoder().decode(raw));
}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}

function renderNotes(){
  var n=DATA.n,es=NL==='es',box=document.getElementById('nv');
  var h='<div class="top"><p class="k" style="margin:0">'+(es?'Novedades':'Novidades')+'</p><div class="lang" role="group" aria-label="Idioma"><button type="button" data-l="es" aria-pressed="'+es+'">ES</button><button type="button" data-l="pt" aria-pressed="'+!es+'">PT</button></div></div>';
  h+='<h1>'+(es?'Qué hay de nuevo':'O que há de novo')+'</h1><p class="s">'+(es?'El estudio se actualiza con el tiempo. Estos son los cambios de cada versión.':'O estudo é atualizado ao longo do tempo. Estas são as mudanças de cada versão.')+'</p>';
  n.forEach(function(v,i){
    var items='<ul>'+v[NL].map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>';
    var head='Versión '+v.v+' <span class="d">'+(es?v.fecha:v.data)+'</span>';
    if(!es)head='Versão '+v.v+' <span class="d">'+v.data+'</span>';
    if(i===0) h+='<div class="ver"><h2>'+head+' <span class="tag">'+(es?'Nueva':'Nova')+'</span></h2>'+items+'</div>';
    else h+='<details class="ver"><summary>'+head+'</summary>'+items+'</details>';
  });
  h+='<div class="acts"><button type="button" class="btn" id="toSt">'+(es?'Ver el estudio':'Ver o estudo')+'</button><a class="btn ghost" id="toSim" href="simulador.html">'+(es?'Ir al simulador':'Ir ao simulador')+'</a></div>';
  box.innerHTML=h;
  box.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){NL=b.getAttribute('data-l');try{localStorage.setItem('solar-lang',NL);localStorage.setItem('solar-sim-lang',NL)}catch(e){};renderNotes()}});
  document.getElementById('toSt').onclick=enter;
  document.getElementById('toSim').onclick=function(){try{localStorage.setItem('solar-sim-lang',NL)}catch(e){}};
}
async function tryPw(pw,silent){
  var e=document.getElementById('err'),g=document.getElementById('go');
  g.disabled=true;g.textContent='Abriendo…';
  try{DATA=await dec(pw);ss('solar-pw',pw);}
  catch(x){g.disabled=false;g.textContent='Entrar';if(!silent)e.textContent='Contraseña incorrecta. Revisá mayúsculas y probá de nuevo. · Senha incorreta.';return;}
  var want=ss('solar-show-notes')==='1'; ss('solar-show-notes',null);
  if(DATA.n&&(!silent||want)){
    try{NL=localStorage.getItem('solar-lang')==='pt'?'pt':'es'}catch(x){}
    document.getElementById('f').hidden=true;document.getElementById('nv').hidden=false;renderNotes();window.scrollTo(0,0);
  } else enter();
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();tryPw(document.getElementById('pw').value.trim(),false)});
if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){document.getElementById('err').textContent='Abrí este enlace en un navegador (Chrome o Safari). · Abra no navegador.';}
else{var sv=ss('solar-pw');if(sv)tryPw(sv,true);}
</script>
